name: Build APK

on:
  push:
    branches: [main]
    # Only changes to the app itself make a new release. README, licence, badges
    # and CI edits don't, so Obtainium and the F-Droid repo only see real updates.
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A release is published only when versionName (and versionCode) in
  # app/build.gradle.kts are bumped. Other pushes just build to check the code.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # tags, to see whether this version is already released

      - name: Check for a version bump
        id: v
        run: bash .github/scripts/check-version.sh

  build:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.apk.outputs.signed }}
      tag: ${{ steps.apk.outputs.tag }}
      version: ${{ steps.apk.outputs.version }}
      apk: ${{ steps.apk.outputs.apk }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::error title=Unsigned build::No signing key set - refusing to build a release signed with the debug key"
            exit 1
          fi

      - name: Check signing key
        if: env.RELEASE_SIGNED == '1'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || vars.KEY_PASSWORD }}
        run: |
          # Fail early with a clear reason instead of a bare packageRelease failure.
          if ! out=$(keytool -list -keystore "$SIGNING_KEYSTORE_PATH" -storepass "$SIGNING_STORE_PASSWORD" 2>&1); then
            echo "::error title=Signing key::Can't open the keystore: $(echo "$out" | head -1). Check KEYSTORE_PASSWORD and that KEYSTORE_BASE64 is the whole base64 text."
            exit 1
          fi
          aliases=$(echo "$out" | grep -iE "PrivateKeyEntry" | cut -d, -f1 | paste -sd ' ')
          if [ -z "$SIGNING_KEY_ALIAS" ] || ! echo "$out" | grep -qi "^$SIGNING_KEY_ALIAS,"; then
            echo "::error title=Signing key::KEY_ALIAS is '$SIGNING_KEY_ALIAS' but the keystore contains: $aliases"
            exit 1
          fi
          if ! keytool -list -keystore "$SIGNING_KEYSTORE_PATH" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" -keypass "${SIGNING_KEY_PASSWORD:-$SIGNING_STORE_PASSWORD}" >/dev/null 2>&1; then
            echo "::error title=Signing key::KEY_PASSWORD doesn't unlock key '$SIGNING_KEY_ALIAS'"
            exit 1
          fi
          echo "Keystore OK, alias '$SIGNING_KEY_ALIAS'"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || vars.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; then
            # Surface compiler errors as an annotation so they're visible without opening the logs.
            msg=$(grep -E "^e: |What went wrong|error:|FAILED" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$msg"
            exit 1
          fi

      - name: Name APK and check signature
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}"
          APK="FilesCtrl-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "certificate DN" | sed 's/^[^:]*: //')
          SHA=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "SHA-256" | sed 's/^.*: //')
          echo "Signed by: $CERT"
          if [ "$RELEASE_SIGNED" != "1" ] || echo "$CERT" | grep -q "Android Debug"; then
            echo "::error title=Signing failed::The APK isn't release-signed - check the key alias and passwords"
            exit 1
          fi
          echo "signed=1" >> "$GITHUB_OUTPUT"
          echo "::notice title=Signed APK::$APK signed by $CERT (SHA-256 $SHA)"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FilesCtrl-apk
          path: |
            ${{ env.APK }}
            app/build/outputs/mapping/release/mapping.txt

  release:
    # Publishes only a release-signed APK; the only job allowed to write to the repository.
    needs: [version, build]
    if: needs.version.outputs.release == 'true' && needs.build.outputs.signed == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # full history and tags, for the release notes

      - name: Write release notes
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          bash .github/scripts/release-notes.sh "$TAG" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FilesCtrl-apk

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: FilesCtrl ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ${{ needs.build.outputs.apk }}
          body_path: ${{ runner.temp }}/notes.md
