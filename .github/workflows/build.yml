name: Build APK

on:
  push:
    branches: [main]
    # Only changes to the app itself make a new release. README, licence, badges
    # and CI edits don't, so Obtainium and the F-Droid repo only see real updates.
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

# Nothing by default; each job gets only what it needs.
permissions: {}

jobs:
  # A release is published only when versionName (and versionCode) in
  # app/build.gradle.kts are bumped. Other pushes just build to check the code.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # tags, to see whether this version is already released

      - name: Check for a version bump
        id: v
        run: bash .github/scripts/check-version.sh

  build:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.apk.outputs.signed }}
      tag: ${{ steps.apk.outputs.tag }}
      version: ${{ steps.apk.outputs.version }}
      apk: ${{ steps.apk.outputs.apk }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Validate Gradle wrapper
        # Refuses a gradle-wrapper.jar that isn't an official Gradle release.
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::error title=Unsigned build::No signing key set - refusing to build a release signed with the debug key"
            exit 1
          fi

      - name: Check signing key
        if: env.RELEASE_SIGNED == '1'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Fail early with a clear reason instead of a bare packageRelease failure.
          # Passwords go to keytool through the environment, never on its command line.
          if ! out=$(keytool -list -keystore "$SIGNING_KEYSTORE_PATH" -storepass:env SIGNING_STORE_PASSWORD 2>&1); then
            echo "::error title=Signing key::Can't open the keystore: $(echo "$out" | head -1). Check KEYSTORE_PASSWORD and that KEYSTORE_BASE64 is the whole base64 text."
            exit 1
          fi
          aliases=$(echo "$out" | grep -iE "PrivateKeyEntry" | cut -d, -f1 | paste -sd ' ')
          if [ -z "$SIGNING_KEY_ALIAS" ] || ! echo "$out" | cut -d, -f1 | grep -qixF -- "$SIGNING_KEY_ALIAS"; then
            echo "::error title=Signing key::KEY_ALIAS is '$SIGNING_KEY_ALIAS' but the keystore contains: $aliases"
            exit 1
          fi
          export CHECK_KEY_PASSWORD="${SIGNING_KEY_PASSWORD:-$SIGNING_STORE_PASSWORD}"
          if ! keytool -list -keystore "$SIGNING_KEYSTORE_PATH" -storepass:env SIGNING_STORE_PASSWORD -alias "$SIGNING_KEY_ALIAS" -keypass:env CHECK_KEY_PASSWORD >/dev/null 2>&1; then
            echo "::error title=Signing key::KEY_PASSWORD doesn't unlock key '$SIGNING_KEY_ALIAS'"
            exit 1
          fi
          echo "Keystore OK, alias '$SIGNING_KEY_ALIAS'"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log; then
            # Surface compiler errors as an annotation so they're visible without opening the logs.
            msg=$(grep -E "^e: |What went wrong|error:|FAILED" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$msg"
            exit 1
          fi

      - name: Name APK and check signature
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}"
          APK="FilesCtrl-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "certificate DN" | sed 's/^[^:]*: //')
          SHA=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "SHA-256" | sed 's/^.*: //')
          echo "Signed by: $CERT"
          if [ "$RELEASE_SIGNED" != "1" ] || echo "$CERT" | grep -q "Android Debug"; then
            echo "::error title=Signing failed::The APK isn't release-signed - check the key alias and passwords"
            exit 1
          fi
          echo "signed=1" >> "$GITHUB_OUTPUT"
          echo "::notice title=Signed APK::$APK signed by $CERT (SHA-256 $SHA)"

      - name: Google-free dependency audit
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Nothing from Google Play services, Firebase, ML Kit, Play Core or Tink may end up in the app.
          # Same signing env as the build: on CI the release build refuses to configure without it.
          if ! ./gradlew --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath > deps.txt 2> deps-err.txt; then
            grep -E 'What went wrong|Exception|error' -A 3 deps-err.txt | head -20 | while IFS= read -r line; do echo "::error title=Dependency audit::${line}"; done
            exit 1
          fi
          if grep -nE 'com\.google\.(android\.gms|firebase|mlkit|android\.play|crypto\.tink)' deps.txt; then
            grep -nE 'com\.google\.(android\.gms|firebase|mlkit|android\.play|crypto\.tink)' deps.txt | head -20 | while IFS= read -r line; do echo "::error title=Google dependency::${line}"; done
            exit 1
          fi
          # Any other library from Google needs a reason. Known and accepted: Guava (and its annotation jars),
          # which the SMB share listing (rapid7 dcerpc) needs, and accompanist-drawablepainter, which Coil's
          # Compose support needs. Anything new (Gson, Protobuf, Play libraries...) fails the build.
          others=$(grep -nE 'com\.google\.|firebase|play-services|gms' deps.txt \
            | grep -vE 'com\.google\.(guava:(guava|failureaccess|listenablefuture):|code\.findbugs:jsr305:|errorprone:error_prone_annotations:|j2objc:j2objc-annotations:|accompanist:accompanist-drawablepainter:)' || true)
          if [ -n "$others" ]; then
            echo "$others" | head -20 | while IFS= read -r line; do echo "::error title=Google dependency::${line}"; done
            exit 1
          fi
          echo "::notice title=Google-free::No Google Play services, Firebase, ML Kit, Play Core or Tink, and no Google library beyond the known ones, in the release dependencies"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FilesCtrl-apk
          path: |
            ${{ env.APK }}
            app/build/outputs/mapping/release/mapping.txt

  release:
    # Publishes only a release-signed APK; the only job allowed to write to the repository.
    needs: [version, build]
    if: needs.version.outputs.release == 'true' && needs.build.outputs.signed == '1'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and its tag
      id-token: write      # sign the build provenance attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0   # full history and tags, for the release notes

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: FilesCtrl-apk

      - name: Write release notes
        env:
          TAG: ${{ needs.build.outputs.tag }}
          APK: ${{ needs.build.outputs.apk }}
        run: |
          bash .github/scripts/release-notes.sh "$TAG" "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          # The APK's SHA-256, so a download can be checked against it.
          printf '\nSHA-256: `%s`  %s\n' "$(sha256sum "$APK" | cut -d' ' -f1)" "$APK" >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Attest build provenance
        # Proves the APK was built by this workflow from the tagged commit:
        # gh attestation verify <apk> -R VoidedKN0X/FilesCtrl
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ needs.build.outputs.apk }}

      - name: Publish release
        # zizmor: ignore[superfluous-actions] softprops/action-gh-release is on the owner's allow-list and pinned to a SHA.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: FilesCtrl ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ${{ needs.build.outputs.apk }}
          body_path: ${{ runner.temp }}/notes.md
