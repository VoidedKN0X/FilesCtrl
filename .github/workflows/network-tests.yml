name: Network tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Nothing by default; the job only reads the code.
permissions: {}

jobs:
  protocols:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Start test servers
        # Images pinned by digest (each was :latest on 2026-11-05), so a changed image can't run in CI unnoticed.
        run: |
          docker run -d --name smb -p 445:445 dperson/samba@sha256:66088b78a19810dd1457a8f39340e95e663c728083efa5fe7dc0d40b2478e869 -p -u "test;test" -s "share;/share;yes;no;no;test"
          docker run -d --name sftp -p 2222:22 atmoz/sftp@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475 test:test:::upload
          docker run -d --name ftp -p 21:21 -p 21000-21010:21000-21010 -e USERS="test|test" -e ADDRESS=127.0.0.1 delfer/alpine-ftp-server@sha256:60bb774d8408d9d4d5c74d05d1c086a34ce192c6c1a142ffac268cac0dbc6fac
          docker run -d --name webdav -p 8080:80 -e AUTH_TYPE=Basic -e USERNAME=test -e PASSWORD=test bytemark/webdav@sha256:21eed0df1238d17766080425f9ef46da2c1130e3e3aa9eaf36794d2a72e7c616
          for p in 445 2222 21 8080; do
            for i in $(seq 1 30); do nc -z 127.0.0.1 $p && break; sleep 1; done
          done
          sleep 3
          docker ps

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Run protocol and archive tests
        env:
          TEST_NET: "1"
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests '*NetVfsTest*' --tests '*ArchiveTest*' -i 2>&1 | tee test.log | grep -E "\[(SMB|SFTP|FTP|WEBDAV)\]|SMB shares| OK$|PASSED|FAILED|SKIPPED|BUILD" || true

      - name: Report results
        if: always()
        run: |
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            msg=$(grep -E "^e: |What went wrong|error:" test.log | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Tests didn't run::$msg"
            exit 1
          fi
          python3 - "${files[@]}" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          bad = 0
          for f in sys.argv[1:]:
              for tc in ET.parse(f).getroot().iter("testcase"):
                  name = tc.get("name")
                  fail = tc.find("failure") if tc.find("failure") is not None else tc.find("error")
                  if tc.find("skipped") is not None:
                      print(f"::warning title=Skipped::{name}")
                  elif fail is not None:
                      bad += 1
                      msg = (fail.get("message") or fail.text or "")[:600].replace("%", "%25").replace("\n", "%0A")
                      print(f"::error title=Failed {name}::{msg}")
                  else:
                      print(f"::notice title=Passed::{name}")
          sys.exit(1 if bad else 0)
          EOF

      - name: Server logs
        if: failure()
        run: for c in smb sftp ftp webdav; do echo "== $c"; docker logs --tail 40 $c 2>&1; done
