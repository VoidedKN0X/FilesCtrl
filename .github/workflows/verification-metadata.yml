name: Dependency verification metadata

# Run by hand after a dependency or Gradle plugin changes. It writes gradle/verification-metadata.xml
# (SHA-256 of every library and plugin the build downloads; entries already in the file are kept) and prints it to the log, gzipped and
# base64-encoded between the BEGIN/END markers. Decode it, check the diff and commit it in the same push.
on:
  workflow_dispatch:

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true

      - name: Write verification metadata
        # No secrets here: without CI and GITHUB_ACTIONS the build script signs the release build with the
        # debug key instead of refusing. Only the downloads matter; nothing from this job is published.
        run: |
          chmod +x gradlew
          env -u CI -u GITHUB_ACTIONS ./gradlew --no-daemon --write-verification-metadata sha256 assembleDebug assembleRelease testDebugUnitTest --continue || echo "::warning::Some tasks failed; the file still lists what was downloaded."

      - name: Print the file
        if: always()
        run: |
          echo "----- BEGIN verification-metadata.xml.gz.b64 -----"
          gzip -9c gradle/verification-metadata.xml | base64 -w 0
          echo
          echo "----- END verification-metadata.xml.gz.b64 -----"
